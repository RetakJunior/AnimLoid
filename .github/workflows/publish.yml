name: Publish AnimLoid Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish_pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/animloid
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  build_appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
          curl -L --fail -o /tmp/appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          sudo ln -s /tmp/appimagetool.AppImage /usr/local/bin/appimagetool
      - name: Build AppImage
        run: |
          chmod +x packaging/linux/build-appimage.sh
          packaging/linux/build-appimage.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: animloid-appimage
          path: dist/AnimLoid-*.AppImage
          if-no-files-found: error

  create_release:
    name: Attach AppImage to GitHub Release
    needs: build_appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: animloid-appimage
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AnimLoid ${{ github.ref_name }}
          files: dist/AnimLoid-*.AppImage
          generate_release_notes: true
